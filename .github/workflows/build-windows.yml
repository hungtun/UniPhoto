name: Build Windows Desktop App (.exe & .msi)

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build UniPhoto Windows x64 (.exe & .msi)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install frontend dependencies, create .venv & build Windows installers
        shell: pwsh
        run: |
          npm --prefix frontend ci
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install `
            fastapi `
            uvicorn `
            pydantic `
            pydantic-settings `
            python-dotenv `
            SQLAlchemy `
            pillow `
            pillow_heif `
            numpy `
            opencv-python `
            mediapipe `
            pyinstaller
          pwsh -File scripts/build_windows_app.ps1

      - name: Upload Windows .exe & .msi workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UniPhoto-Windows-x64-Installers
          if-no-files-found: error
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi

      - name: Attach Windows .exe & .msi installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
